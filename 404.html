</head><body><main><a class="brand" data-home href="index.html">まちかど足利</a><p class="code" aria-hidden="true">404</p><h1>ページが見つかりません</h1><p>URLが変わったか、ページが移動した可能性があります。<br>ホームや記事一覧から、もう一度探してみてください。</p><nav aria-label="ページを探す"><a class="button" data-home href="index.html">ホームへ戻る</a><a class="button secondary" data-archive href="archive.html">記事一覧から探す</a><a class="button secondary" href="https://note.com/joyous_daisy1459">noteで読む</a></nav><footer><p>まちかど足利は個人運営の地域メディアです。足利市の公式サイトではありません。</p></footer></main>
<script>
(() => {
  const configuredSiteUrl = "https://koki-mino.github.io/machikado-ashikaga/";
  const configured = new URL(configuredSiteUrl);
  let base;
  if (location.protocol === "file:") base = new URL("./", location.href);
  else if (location.origin === configured.origin && location.pathname.startsWith(configured.pathname)) base = configured;
  else if (location.hostname.endsWith(".github.io")) {
    const first = location.pathname.split("/").filter(Boolean)[0] || "";
    base = new URL(first && !first.includes(".") ? "/" + first + "/" : "/", location.origin);
  } else base = new URL("/", location.origin);
  document.querySelectorAll("[data-home]").forEach(a => a.href = new URL("index.html", base).href);
  document.querySelectorAll("[data-archive]").forEach(a => a.href = new URL("archive.html", base).href);
})();
</script></body></html>
